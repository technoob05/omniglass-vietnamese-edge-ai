[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniglass-demo"
version = "0.1.0"
description = "Local-first shared perception and continual visual-memory demo"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5.0,<6",
  "numpy>=1.24,<3",
  "opencv-python>=4.8,!=4.13.0.90",
  "lap>=0.5.12",
  "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
vlm = ["transformers>=4.49", "accelerate>=1.0", "pillow>=10"]

[project.scripts]
omniglass-demo = "omniglass.app:main"
omniglass-live = "omniglass.live:main"

[tool.setuptools.packages.find]
include = ["omniglass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
